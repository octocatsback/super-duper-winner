name: Security hygiene

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  no-tracked-live-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail if live secret filenames are tracked
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^/]+$|(^|/)id_rsa$|(^|/)id_ed25519$|(^|/)id_ecdsa$' | grep -vE '\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "Live secret filenames must not be tracked:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          echo "No tracked live secret filenames."

name: Security hygiene

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  no-tracked-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail if secret-like files are tracked
        run: |
          set -euo pipefail
          # When this workflow runs from the umbrella monorepo, only scan Gareth/.
          scope=()
          if [ -d Gareth ] && [ -f Gareth/.github/workflows/security-hygiene.yml ]; then
            scope=(Gareth)
          fi
          tracked="$(git ls-files "${scope[@]}" | grep -E '(^|/)\.env$|(^|/)\.env\.[^/]+$|\.pem$|(^|/)id_rsa$|(^|/)id_ed25519$|(^|/)id_ecdsa$' | grep -vE '\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "Secret-like files must not be tracked:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          echo "No tracked secret-like filenames."
